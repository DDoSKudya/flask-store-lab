[build-system]
requires = ["wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-store-lab"
version = "1.1.0"
description = "Учебный Flask-проект: каталог товаров с формами на Jinja2, валидацией через Pydantic, хранением данных в SQLite через SQLAlchemy и миграциями Alembic."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-line-length = 120

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
exclude = "(^migrations/|^\\.venv/)"

disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["flask.*", "flask_sqlalchemy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.models"]
disable_error_code = ["name-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

markers = [
  "unit: fast unit tests",
  "integration: integration tests with app/client/db",
]
