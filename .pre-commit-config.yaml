repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
       - id: ruff
         args: [--fix]
         files: ^(app/|wsgi\.py$)
       - id: ruff-format
         files: ^(app/|wsgi\.py$)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        files: ^(app/|wsgi\.py$)
        additional_dependencies:
          - setuptools==82.0.1
          - Flask==3.1.3
          - SQLAlchemy==2.0.49
          - Flask-SQLAlchemy==3.1.1
          - alembic==1.18.4
          - pydantic==2.13.3
          - uWSGI==2.0.31
          - python-dotenv==1.2.2
